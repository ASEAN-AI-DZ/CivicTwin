name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build_and_release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build project
        run: |
          echo "Thêm các lệnh build của dự án (frontend/backend/ai-service/mobile) nếu cần."
          # Ví dụ:
          # cd frontend && yarn install && yarn build
          # cd ../backend && composer install --no-dev
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
          # Nếu có file build đóng gói, bạn có thể thêm files vào pre-release hoặc release thông thường:
          # files: |
          #   frontend/dist/*
          #   backend/build/*
